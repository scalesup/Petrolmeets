  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n  @media (max-width:760px) {\n    input, textarea, select { font-size:16px !important; }   /* stops iPhone zooming into fields */\n    [data-rq=head] { padding:calc(8px + env(safe-area-inset-top)) 14px 8px !important; gap:8px 12px !important; }\n    [data-rq=head] > div:first-of-type { display:none !important; }\n    [data-rq=meta] { margin-left:0 !important; width:100%; gap:8px !important; }\n    [data-rq=meta] > div:first-child { flex:1 1 100%; }\n    [data-rq=body] { padding:0 12px calc(40px + env(safe-area-inset-bottom)) !important; }\n    [data-rq=tabs] { margin:0 -12px 14px !important; padding:0 12px !important; }\n    [data-rq=body] button { min-height:40px; }\n  }\n\n  :focus-visible{outline:2px solid var(--pm-accent,#ff3131)!important;outline-offset:2px;}\n  :focus:not(:focus-visible){outline:none;}\n  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden; background:#eceae5;\">\n\n  <div data-rq=\"head\" style=\"flex:none; border-bottom:1px solid #d6d3cb; background:#faf9f6; padding:calc(14px + env(safe-area-inset-top)) 28px 14px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; z-index:50;\">\n    <a href=\"/\" title=\"Back to the map\" style=\"display:flex; align-items:center; gap:8px; color:#1a1917;\">\n      <div style=\"width:11px; height:11px; background:oklch(0.55 0.19 32);\"><\u002Fdiv>\n      <div style=\"font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:14px; letter-spacing:.22em;\">PETROLMEETS<\u002Fdiv>\n    <\u002Fa>\n    <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:#6b6860; padding-left:14px; border-left:1px solid #ddd9d0;\">REVIEW QUEUE<\u002Fdiv>\n    <div style=\"display:flex; gap:6px;\">\n      <a href=\"/\" style=\"height:32px; padding:0 12px; display:flex; align-items:center; border:1px solid #ddd9d0; border-radius:3px; background:#faf9f6; color:#3d3b35; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em;\" style-hover=\"border-color:oklch(0.55 0.19 32);\">← MAP<\u002Fa>\n      <a href=\"/admin/\" style=\"height:32px; padding:0 12px; display:flex; align-items:center; border:1px solid #ddd9d0; border-radius:3px; background:#faf9f6; color:#3d3b35; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em;\" style-hover=\"border-color:oklch(0.55 0.19 32);\">ADMIN<\u002Fa>\n    <\u002Fdiv>\n    <sc-if value=\"{{ inQueue }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-rq=\"meta\" style=\"margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em; color:#6b6860;\">{{ gateLabel }}<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#3d3b35;\">{{ userLabel }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ refresh }}\" style=\"height:32px; padding:0 12px; border-radius:3px; background:#faf9f6; border:1px solid #ddd9d0; color:#3d3b35; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; cursor:pointer;\">REFRESH<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ signOut }}\" style=\"height:32px; padding:0 12px; border-radius:3px; background:none; border:1px solid #ddd9d0; color:#6b6860; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; cursor:pointer;\">{{ signOutLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div data-rq=\"scroll\" style=\"flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;\">\n\n  <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:80px 28px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:#6b6860;\">CONNECTING…<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isConnect }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding:56px 20px; display:flex; justify-content:center;\">\n      <div style=\"width:100%; max-width:440px; border:1px solid #d6d3cb; background:#faf9f6; padding:26px 26px 22px;\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:30px; line-height:1;\">SIGN IN TO REVIEW<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#6e6b62; line-height:1.5; margin-top:8px; text-wrap:pretty;\">Approve, edit or reject what the sweep found. Only moderator accounts can see the queue.<\u002Fdiv>\n        <div style=\"margin-top:20px; display:flex; flex-direction:column; gap:13px;\">\n          <label style=\"display:flex; flex-direction:column; gap:5px;\">\n            <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:#6b6860;\">SUPABASE PUBLISHABLE KEY<\u002Fspan>\n            <input aria-label=\"sb_publishable_\" value=\"{{ cfgKey }}\" sc-camel-on-change=\"{{ onCfgKey }}\" placeholder=\"sb_publishable_… or eyJ…\" style=\"height:38px; padding:0 11px; border:1px solid #ddd9d0; border-radius:3px; background:#fff; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:#1a1917;\">\n            <span style=\"font-size:12px; color:#6b6860; line-height:1.4;\">Supabase → Project Settings → API Keys. Safe in the browser.<\u002Fspan>\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:5px;\">\n            <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:#6b6860;\">MAPBOX PUBLIC TOKEN · OPTIONAL<\u002Fspan>\n            <input aria-label=\"pk.\" value=\"{{ cfgMapbox }}\" sc-camel-on-change=\"{{ onCfgMapbox }}\" placeholder=\"pk.…\" style=\"height:38px; padding:0 11px; border:1px solid #ddd9d0; border-radius:3px; background:#fff; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:#1a1917;\">\n            <span style=\"font-size:12px; color:#6b6860; line-height:1.4;\">Only needed when you fix a venue, so the new address can be placed on the map.<\u002Fspan>\n          <\u002Flabel>\n          <div style=\"height:1px; background:#e2ded5; margin:3px 0;\"><\u002Fdiv>\n          <label style=\"display:flex; flex-direction:column; gap:5px;\">\n            <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:#6b6860;\">EMAIL<\u002Fspan>\n            <input aria-label=\"Email\" type=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" style=\"height:38px; padding:0 11px; border:1px solid #ddd9d0; border-radius:3px; background:#fff; font-size:14px; color:#1a1917;\">\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:5px;\">\n            <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:#6b6860;\">PASSWORD<\u002Fspan>\n            <input aria-label=\"Password\" type=\"password\" value=\"{{ password }}\" sc-camel-on-change=\"{{ onPassword }}\" sc-camel-on-key-down=\"{{ onPwKey }}\" style=\"height:38px; padding:0 11px; border:1px solid #ddd9d0; border-radius:3px; background:#fff; font-size:14px; color:#1a1917;\">\n          <\u002Flabel>\n          <sc-if value=\"{{ hasAuthErr }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px; color:oklch(0.5 0.19 32); line-height:1.4;\">{{ authErr }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ signIn }}\" style=\"height:42px; background:oklch(0.55 0.19 32); border:none; border-radius:3px; color:#faf9f6; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; cursor:pointer; opacity:{{ signInOpacity }};\">{{ signInLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ startDemo }}\" style=\"height:36px; background:none; border:1px solid #ddd9d0; border-radius:3px; color:#6e6b62; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; cursor:pointer;\">PREVIEW WITH SAMPLE DATA<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isDenied }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:56px 20px; display:flex; justify-content:center;\">\n      <div style=\"width:100%; max-width:560px; border:1px solid #d6d3cb; background:#faf9f6; padding:26px;\">\n        <div style=\"font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:28px; line-height:1;\">NOT A MODERATOR YET<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#6e6b62; line-height:1.5; margin-top:8px; text-wrap:pretty;\">You're signed in, but this account can't see the queue. Run this once in the Supabase SQL Editor, then check again.<\u002Fdiv>\n        <div style=\"margin-top:14px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; line-height:1.65; color:#3d3b35; white-space:pre-wrap; word-break:break-word; background:#f4f2ed; border:1px solid #e2ded5; padding:12px 13px;\">{{ grantSql }}<\u002Fdiv>\n        <div style=\"margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;\">\n          <button sc-camel-on-click=\"{{ recheck }}\" style=\"height:38px; padding:0 15px; background:oklch(0.48 0.14 150); border:none; border-radius:3px; color:#faf9f6; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; cursor:pointer;\">CHECK AGAIN<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ signOut }}\" style=\"height:38px; padding:0 15px; background:none; border:1px solid #ddd9d0; border-radius:3px; color:#6e6b62; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; cursor:pointer;\">SIGN OUT<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u |late\\s*nite|midnight|after\\s*dark|till\\s*late|11\\s*pm)\\b/i },\n];\nconst HAS_CLOCK = /\\b\\d{1,2}(:\\d{2})?\\s*(am|pm|a\\.m\\.|p\\.m\\.)\\b|\\b\\d{1,2}:\\d{2}\\b/i;\nfunction timeHint(text) {\n  const t = text || '';\n  for (const s of [...TIME_SLOTS].reverse()) { const m = t.match(s.re); if (m) return { ...s, word: m[0] }; }\n  return null;\n}\nfunction timeMissing(r, d) {\n  const cap = r.extraction?.capture?.caption || '';\n  if (r.extraction?.output?.cancellation_signal) return false;\n  if ((r.extraction?.flags || []).includes('time_missing')) return true;\n  if (!r.extraction?.output?.start_time && !r.meet) return true;\n  return (!d.start || d.start === '12:00') && !HAS_CLOCK.test(cap);\n}\n\nconst BBOX = '-98.6,29.5,-96.9,31.0';\nconst STOP = new Set(['the', 'and', '&', 'at', 'of', 'atx', 'austin', 'tx', 'lot', 'parking', 'cafe', 'co', 'inc']);\nconst words = s => (s || '').toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9 ]/g, ' ').split(/\\s+/).filter(w => w && !STOP.has(w));\nfunction nameSim(a, b) {\n  const A = new Set(words(a)), B = new Set(words(b));\n  if (!A.size || !B.size) return 0;\n  let n = 0; A.forEach(w => { if (B.has(w)) n++; });\n  return n / Math.min(A.size, B.size);\n}\nfunction miles(a, b) {\n  const r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);\n  const x = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;\n  return 3958.8 * 2 * Math.asin(Math.sqrt(x));\n}\nfunction point(loc) {\n  if (!loc) return null;\n  if (typeof loc === 'object' && loc.coordinates) return { lng: loc.coordinates[0], lat: loc.coordinates[1] };\n  if (typeof loc !== 'string' || !/^[0-9a-f]+$/i.test(loc)) return null;\n  const b = new Uint8Array(loc.match(/../g).map(x => parseInt(x, 16))), dv = new DataView(b.buffer), le = b[0] === 1;\n  const off = (dv.getUint32(1, le) & 0x20000000) ? 9 : 5;\n  return { lng: dv.getFloat64(off, le), lat: dv.getFloat64(off + 8, le) };\n}\nconst ALIAS = .title || 'Untitled', venue: p.d.venue || 'Venue not set', chips, border: twin ? SIGNAL : '#ddd9d0',\n            onClick: () => { try { const sc = document.querySelector('[data-rq=scroll]'); if (sc) sc.scrollTop = 0; } catch (e) {} this.load(side === 'review' ? 'open' : 'live'); } }; };\n        const days = [...new Set([...rv, ...lv].map(p => p.day))].sort((a, b) => !a ? 1 : !b ? -1 : a.localeCompare(b));\n        const today = fmtDate(new Date().toISOString()), tmr = fmtDate(new Date(Date.now() + 864e5).toISOString());\n        const cmpDays = days.map(day => { const R = rv.filter(p => p.day === day), L = lv.filter(p => p.day === day);\n          const label = !day ? 'NO DATE' : new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric' }).format(new Date(day + 'T12:00:00Z')).toUpperCase();\n          const sub = day === today ? 'TODAY' : day === tmr ? 'TOMORROW' : day && day < today ? 'PAST' : R.length + ' TO REVIEW · ' + L.length + ' LIVE';\n          return { label, sub, subColor: day === today || day === tmr ? SIGNAL : '#6b6860', rev: R.map(p => row(p, 'review', L)), live: L.map(p => row(p, 'live', R)), revNone: !R.length, liveNone: !L.length }; });\n        return { isCompare: true, cmpDays, cmpReviewCount: s.cmp ? rv.length : '…', cmpLiveCount: s.cmp ? lv.length : '…',\n          cmpGoReview: () => this.load('open'), cmpGoLive: () => this.load('live'),\n          cmpNone: !!s.cmp && !days.length && !s.listErr, cmpNoneText: 'Nothing waiting and nothing live yet.' };\n      })(),\n      isEmpty: (s.tab === 'content' || s.tab === 'age' || s.tab === 'edits' || s.tab === 'auto' || s.tab === 'compare') ? false : s.tab === 'vendors' ? !(s.vendors || []).length && !s.listErr : s.tab === 'claims' ? !(s.claims || []).length && !s.listErr : s.tab === 'archive' ? !arch.length && !s.listErr : items.length === 0 && !s.listErr,\n      isArchive: s.tab === 'archive' && arch.length > 0,\n      archQ: s.archQ, onArchQ: e => this.setState({ archQ: e.target.value }),\n      archSummary: archShown.length + (archQ ? ' MATCHING' : ' PAST MEETS') + ' · ' + archShown.filter(m => m.status === 'cancelled').length + ' CANCELLED',\n      archGroups,\n      emptyTitle: s.tab === 'vendors' ? 'NO VENDORS YET' : s.tab === 'claims' ? 'NO CLAIMS' : s.tab === 'archive' ? 'NO HISTORY YET' : s.tab === 'open' ? 'QUEUE CLEAR' : s.tab === 'live' ? 'NOTHING LIVE' : 'NOTHING HELD',\n      emptyNote: s.tab === 'vendors' ? 'Vendor listings show up here when someone submits one from the app (Account → VENDOR).' : s.tab === 'claims' ? 'Claims from the app show up here. Pending ones stay until someone decides.' : s.tab === 'archive' ? 'Meets move here 12 hours after they start.' : s.tab === 'open' ? 'Next sweep: ' + nextSweep() + ' (Austin time).' : s.tab === 'live' ? 'Approved meets appear here until 12 hours after they start.' : 'Use HOLD on a meet to park it here.',\n      items,\n      selCount: Object.values(s.sel).filter(Boolean).length,\n      showBulk: (s.tab === 'open' || s.tab === 'held') && items.length > 0,\n      hasSel: Object.values(s.sel).some(Boolean),\n      selLabel: (() => { const n = Object.values(s.sel).filter(Boolean).length; return n ? n + ' SELECTED' : 'SELECT MEETS TO ACT ON SEVERAL AT ONCE'; })(),\n      selAllLabel: items.length && items.every(q => s.sel[q.id]) ? 'CLEAR ALL' : 'SELECT ALL',\n      onSelAll: () => this.setState(st => { const all = st.items.length && st.items.every(q => st.sel[q.id]); return { sel: all ? {} : Object.fromEntries(st.items.map(q => [q.id, true])) }; }),\n      bulkApprove: () => !s.bulkBusy && this.bulk('approve'),\n      bulkDup: () => !s.bulkBusy && this.bulk('duplicate'),\n      bulkReject: () => !s.bulkBusy && this.bulk('other'),\n      bulkLabel: s.bulkBusy ? 'WORKING…' : 'APPROVE ALL',\n      needToken: !s.demo && !s.cfg.mapbox.trim(),\n      tokenDraft: s.tokenDraft, onTokenDraft: e => this.setState({ tokenDraft: e.target.value }),\n      saveToken: () => { const cfg = { ...s.cfg, mapbox: s.tokenDraft.trim() }; if (!cfg.mapbox) return; this.saveCfg(cfg); this.setState({ cfg, tokenDraft: '' }, () => this.autoFind(this.state.items)); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
